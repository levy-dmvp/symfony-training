Mutation:
  type: object

  config:

    fields:
      createDinosaur:
        access: "@=isGranted('ROLE_ADMIN')"
        type: 'Dinosaur!'
        args: { input: { type: 'CreateDinosaurInput!' } }
        resolve: |
          @=mutation(
            "createDinosaur",
            args["input"]
          )
      deleteDinosaur:
        type: 'Boolean!'
        args: { id: 'ID!' }
        resolve: |
          @=mutation(
            "deleteDinosaur",
            args["id"]
          )
      createSpecies:
        type: 'Species!'
        args: { input: { type: 'CreateSpeciesInput!' } }
        resolve: |
          @=mutation(
            "createSpecies",
            args["input"]
          )
      login:
        type: 'String!'
        args: { email: { type: 'String!' }, password: { type: 'String!' }  }
        resolve: |
          @=mutation(
            "login",
            args["email"],
            args["password"]
          )
