Mutation:
  type: object
  config:
    fields:
      createDinosaur:
        type: 'Dinosaur!'
        args: { input: { type: 'CreateDinosaurInput!' } }
        resolve: |
          @=mutation(
            "createDinosaur",
            args["input"]
          )
      deleteDinosaur:
        type: 'Boolean!'
        args: { id: 'ID!' }
        resolve: |
          @=mutation(
            "deleteDinosaur",
            args["id"]
          )
      createSpecies:
        type: 'Species!'
        args: { input: { type: 'CreateSpeciesInput!' } }
        resolve: |
          @=mutation(
            "createSpecies",
            args["input"]
          )
