Mutation:
  type: object
  config:
    fields:
      createDinosaur:
        type: 'Dinosaur!'
        args: { input: { type: 'CreateDinosaurInput!' } }
        resolve: |
          @=mutation(
            "createDinosaur",
            args["input"]
          )
      createSpecies:
        type: 'Species!'
        args: { input: { type: 'CreateSpeciesInput!' } }
        resolve: |
          @=mutation(
            "createSpecies",
            args["input"]
          )
