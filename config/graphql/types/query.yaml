Query:
  type: object
  config:
    fields:
      dinosaurs:
        access: "@=hasRole('ROLE_TRUC')" #role mis a la main en BDD
        complexity: '@=20 + childrenComplexity'
        type: '[Dinosaur!]!'
        args: { search: { type: 'String' } }
        resolve:  |
          @=query(
            "dinosaurs",
            args["search"]
          )
      dinosaur:
        access: "@=isAuthenticated()"
        type: 'Dinosaur!'
        args: { id: { type: 'ID!' } }
        resolve:  |
          @=query(
            "dinosaur",
            args["id"]
          )
      species:
        access: "@=isAuthenticated()"
        complexity: '@=20 + childrenComplexity'
        type: '[Species!]!'
        args: { search: { type: 'String' } }
        resolve:  |
          @=query(
            "species",
            args["search"]
          )
